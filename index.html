<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gloob">
<meta name="theme-color" content="#1f6f54">
<meta name="robots" content="noindex, nofollow">
<title>Gloob</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f6f5;color:#1d2a25;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .c{max-width:340px;width:100%;text-align:center}
  .i{font-size:46px}
  input,button{width:100%;box-sizing:border-box;font-size:17px;border-radius:12px;padding:13px;margin-top:12px}
  input{border:1px solid #c9d3cf}
  button{border:0;background:#1f6f54;color:#fff;font-weight:600}
  .m{color:#5d6b66;font-size:15px;line-height:1.4}
  .h{display:none}
</style>
</head>
<body>
<div class="c">
  <div class="i" id="ic">⏳</div>
  <h2 style="margin:8px 0 6px">Gloob</h2>
  <div class="m" id="msg">Carregando…</div>
  <div class="h" id="nm">
    <input id="nome" maxlength="40" placeholder="Nome deste aparelho (ex.: iPhone da Bea)">
    <button type="button" id="pedir">Pedir acesso</button>
  </div>
  <button type="button" class="h" id="tentar">Já aprovei, tentar de novo</button>
</div>
<script>
(function () {
const API = "https://script.google.com/macros/s/AKfycbzVlnZD1v1QPDk8ox7TsO1okgK_9zkPbE8eFyLVgMViqVJelqd_PpHy6J17VWYWanUs/exec";
const $ = id => document.getElementById(id);
function tok() {
  let t = localStorage.getItem("devTok");
  if (!t) {
    const b = new Uint8Array(24); crypto.getRandomValues(b);
    t = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
    localStorage.setItem("devTok", t);
  }
  return t;
}
function tela(ic, msg, nome, tentar) {
  $("ic").textContent = ic; $("msg").textContent = msg;
  $("nm").className = nome ? "" : "h"; $("tentar").className = tentar ? "" : "h";
}
async function abrir() {
  if (!localStorage.getItem("devNome")) return tela("🔒", "Este aparelho ainda não tem acesso. Dê um nome para ele e peça acesso.", true);
  tela("⏳", "Carregando…");
  try {
    const r = await fetch(API, {method: "POST", body: JSON.stringify({fn: "__html", dev: tok(), nome: localStorage.getItem("devNome") || ""})});
    const j = await r.json();
    if (j.ok) { document.open(); document.write(j.r); document.close(); return; }
    if (j.e === "PEND") {
      if (!localStorage.getItem("devNome")) return tela("🔒", "Este aparelho ainda não tem acesso. Dê um nome para ele e peça acesso.", true);
      return tela("🔒", "Pedido enviado. Agora a Bea precisa aprovar este aparelho (" + localStorage.getItem("devNome") + ") no app, em Acessos, ou na aba Acessos da planilha.", false, true);
    }
    tela("⚠️", "Erro: " + j.e, false, true);
  } catch (e) { tela("⚠️", "Sem conexão. Tente de novo.", false, true); }
}
$("pedir").onclick = () => { const n = $("nome").value.trim(); if (!n) return $("nome").focus(); localStorage.setItem("devNome", n); abrir(); };
$("tentar").onclick = abrir;
abrir();
})();
</script>
</body>
</html>
